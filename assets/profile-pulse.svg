<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="title desc">
  <title id="title">Sojjyuu profile pulse</title>
  <desc id="desc">A compact profile snapshot showing projects, featured builds and creative focus.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d141d"/>
      <stop offset="1" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31ddf4"/>
      <stop offset=".5" stop-color="#6ab7ff"/>
      <stop offset="1" stop-color="#ff7da7"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="208" rx="18" fill="url(#panel)" stroke="#273746" stroke-width="2"/>
  <rect x="24" y="22" width="952" height="3" rx="1.5" fill="url(#line)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="55" fill="#69808d" font-size="11" font-weight="700" letter-spacing="2.5">PROFILE PULSE // LIVE &amp; LEARNING</text>

    <g transform="translate(42 80)">
      <text x="0" y="40" fill="#eafaff" font-size="42" font-weight="800">30+</text>
      <text x="0" y="66" fill="#75dcea" font-size="12" font-weight="700" letter-spacing="1.8">PROJECT REPOSITORIES</text>
    </g>
    <path d="M330 76v88" stroke="#31414d"/>
    <g transform="translate(374 80)">
      <text x="0" y="40" fill="#eafaff" font-size="42" font-weight="800">04</text>
      <text x="0" y="66" fill="#91bcf0" font-size="12" font-weight="700" letter-spacing="1.8">FEATURED BUILDS</text>
    </g>
    <path d="M650 76v88" stroke="#31414d"/>
    <g transform="translate(694 80)">
      <text x="0" y="40" fill="#eafaff" font-size="42" font-weight="800">100%</text>
      <text x="0" y="66" fill="#f194b3" font-size="12" font-weight="700" letter-spacing="1.8">CURIOUS BY DEFAULT</text>
    </g>

    <text x="42" y="186" fill="#6f8490" font-size="11" letter-spacing="1.5">CURRENT SIGNAL</text>
    <text x="174" y="186" fill="#b9c9d0" font-size="11" font-weight="700" letter-spacing="1.2">EXPO  /  REACT NATIVE  /  UI-UX  /  CREATIVE CODE</text>
    <circle cx="958" cy="182" r="5" fill="#7ee787"/>
  </g>
